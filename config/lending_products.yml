# Lending products.
#
# This file is the extension seam: a new product is a new entry here, and
# nothing in app/ changes. Every rate is a QUOTED string so Psych hands it to
# Lending::Product as text and it becomes an exact BigDecimal. An unquoted
# 0.13 would be parsed as a binary Float and Lending::Product rejects it.
#
#   purchase_price_ltv    cap as a fraction of the purchase price (loan-to-cost)
#   arv_ltv               cap as a fraction of the after-repair value
#   annual_interest_rate  simple annual rate, accrued monthly over the term
#   min/max_term_months   term window offered for this product

fix_and_flip:
  name: "Fix & Flip"
  description: "Buy, rehab and resell. Our standard short-term product."
  purchase_price_ltv: "0.90"
  arv_ltv: "0.70"
  annual_interest_rate: "0.13"
  min_term_months: 1
  max_term_months: 12
  default: true

bridge:
  name: "Bridge"
  description: "Cover a gap on a stabilised property while longer-term financing is arranged."
  purchase_price_ltv: "0.80"
  arv_ltv: "0.65"
  annual_interest_rate: "0.1150"
  min_term_months: 3
  max_term_months: 24

new_construction:
  name: "New Construction"
  description: "Ground-up build on an acquired lot, drawn against the completed value."
  purchase_price_ltv: "0.75"
  arv_ltv: "0.65"
  annual_interest_rate: "0.1175"
  min_term_months: 6
  max_term_months: 18
