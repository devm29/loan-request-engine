# Connection settings come from the environment in every environment, so the
# same checkout runs against a local PostgreSQL, the docker compose stack, or a
# managed database with nothing but exported variables.
#
#   DATABASE_URL                 full URL; overrides everything below
#   POSTGRES_HOST / _PORT        where the server is (default localhost:5432)
#   POSTGRES_USER / _PASSWORD    credentials (default: the OS user, no password)
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "longleaf_development") %>

# Warning: this database is erased and regenerated by the test suite.
test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB", "longleaf_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "longleaf_production") %>
